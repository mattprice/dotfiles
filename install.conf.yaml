# https://github.com/anishathalye/dotbot#configuration

- defaults:
    link:
      create: true
      relink: true
      force: true
    shell:
      stdout: true

- clean: ["~"]

- create:
    - ~/.config/projects

- link:
    # Terminal
    ~/.zshenv: zsh/zshenv.zsh
    ~/.zshrc: zsh/zshrc.zsh
    ~/.zshrc_local:
      path: zsh/zshrc_local.zsh
      if: "[[ -f zsh/zshrc_local.zsh ]]"
    ~/.bunfig.toml: bun/bunfig.toml
    ~/.config/ghostty: ghostty
    ~/.config/htop: htop
    ~/.config/lazygit: lazygit
    ~/.config/mise/config.toml: mise/mise.toml
    ~/.config/pip/pip.conf: pip/pip.conf
    ~/.config/pnpm/config.yaml: pnpm/config.yaml
    ~/.config/uv/uv.toml: uv/uv.toml
    ~/.config/zed/keymap.json: zed/keymap.json
    ~/.config/zed/settings.json: zed/settings.json
    ~/.gitconfig: git/gitconfig
    ~/.gitconfig_local:
      path: git/gitconfig_local
      if: "[[ -f git/gitconfig_local ]]"
    ~/.gitignore_global: git/gitignore_global
    ~/.yarnrc.yml: yarn/yarnrc.yml

    # Mac Applications
    ~/.config/karabiner:
      path: karabiner
      if: "[[ $(uname -s) == 'Darwin' ]]"
    ~/.local/bin/code:
      path: /Applications/Visual Studio Code.app/Contents/Resources/app/bin/code
      if: "[[ -e '/Applications/Visual Studio Code.app' ]]"
    ~/.local/bin/fork:
      path: /Applications/Fork.app/Contents/Resources/fork_cli
      if: "[[ -e '/Applications/Fork.app' ]]"
    ~/.local/bin/zed:
      path: /Applications/Zed.app/Contents/MacOS/cli
      if: "[[ -e '/Applications/Zed.app' ]]"
    "~/Library/Application Support/Zed/extensions/work/oxc2/.npmrc":
      path: zed/oxc-npmrc
      if: '[[ -d "$HOME/Library/Application Support/Zed/extensions/work/oxc" ]]'

- shell:
    - command: 'if [[ "$SHELL" != "/bin/zsh" ]]; then chsh -s /bin/zsh; fi'
      description: Setting default shell to zsh [chsh -s /bin/zsh]
      quiet: true
      stdin: true
    - [mise install, Installing Mise tools]
    - [npm config set min-release-age 3, Setting npm min-release-age]

    - [./scripts/defaults.sh, Configuring macOS settings]
    - [./scripts/default-apps.sh, Configuring default applications for files]
    - [./scripts/spotlight-ignore.py, Excluding folders from Spotlight indexing]
